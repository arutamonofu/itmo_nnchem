[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perovskite-screening"
version = "0.1.0"
description = "Reproducible ML pipeline for data-efficient screening of perovskites."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "scipy>=1.11,<1.16",
  "scikit-learn>=1.4,<1.8",
  "matminer>=0.9.3,<0.11",
  "pymatgen>=2024.5,<2027",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
xgb = ["xgboost>=2,<4"]

[project.scripts]
perovskite-screening = "perovskite_screening.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
