project:
  name: perovskite_screening

data:
  dataset_name: matbench_perovskites
  target: formation_energy
  target_unit: eV/unit cell
  processed_path: data/processed/dataset.pkl

splits:
  random_seed: 42
  default_strategy: random_iid

model:
  family: cgcnn
  params:
    epochs: 100
    batch_size: 128
    lr: 0.0003
    weight_decay: 0.00001
    device: cuda
    cutoff: 8.0
    hidden_dim: 64
    edge_dim: 64
    early_stopping_patience: 15
    scheduler_patience: 8
    monitor: val_mae
