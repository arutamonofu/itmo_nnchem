project:
  name: perovskite_screening

data:
  dataset_name: matbench_perovskites
  target: formation_energy
  target_unit: eV/unit cell
  processed_path: data/processed/dataset.pkl

splits:
  random_seed: 42
  default_strategy: random_iid
  val_size: 0.10
  test_size: 0.10

model:
  family: descriptor_baseline
  kind: xgb
  feature_set: expanded
  params:
    objective: reg:squarederror
    n_estimators: 800
    learning_rate: 0.03
    max_depth: 4
    min_child_weight: 2
    subsample: 0.85
    colsample_bytree: 0.85
    reg_lambda: 2.0
    reg_alpha: 0.0
    tree_method: hist
    n_jobs: -1
